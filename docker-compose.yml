services:
  postgres:
    image: postgres:16-alpine
    container_name: painel-financeiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: painel_financeiro
    ports:
      - "5432:5432"
    volumes:
      - painel_financeiro_pgdata:/var/lib/postgresql/data

volumes:
  painel_financeiro_pgdata:
